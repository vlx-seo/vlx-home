<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" role="img" aria-label="Loose, blurry phone photo of a roof">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6E2EC"/><stop offset="1" stop-color="#BFC9D2"/>
    </linearGradient>
    <linearGradient id="shingle2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA3AB"/><stop offset="1" stop-color="#7C858D"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <radialGradient id="flare" cx="82%" cy="16%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="58%" stop-color="#0f172a" stop-opacity="0"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".3"/>
