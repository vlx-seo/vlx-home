<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" role="img" aria-label="Loose, blurry phone photo of the same roof — no annotation">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8E4EE"/><stop offset="1" stop-color="#C3D2DE"/>
    </linearGradient>
    <linearGradient id="shingle2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#98A1A9"/><stop offset="1" stop-color="#7C858D"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <radialGradient id="flare" cx="82%" cy="14%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".28"/>
    </radialGradient>
  </defs>
  <!-- Same roof geometry as annotated-roof.svg, but blurred, washed out and un-annotated -->
  <g filter="url(#blur)">
    <rect width="380" height="110" fill="url(#sky2)"/>
    <path d="M0 44 L380 18 L380 110 L0 110 Z" fill="url(#shingle2)"/>
    <g stroke="#7d858d" stroke-width="1.1" opacity=".4">
      <path d="M0 60 L380 36"/><path d="M0 76 L380 55"/><path d="M0 92 L380 74"/>
    </g>
    <ellipse cx="146" cy="76" rx="48" ry="21" fill="#434d57" opacity=".4"/>
    <ellipse cx="146" cy="76" rx="30" ry="12" fill="#333c45" opacity=".38"/>
  </g>
  <rect width="380" height="110" fill="url(#flare)"/>
  <rect width="380" height="110" fill="url(#vig)"/>
</svg>
